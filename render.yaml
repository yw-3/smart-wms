# ===== Render 部署蓝图（Blueprint）=====
# 用法：Render 控制台 → New → Blueprint → 选本仓库 → 填 DATABASE_URL → Apply
# 会创建一个 Web Service（Docker 构建），产物为一个永久公开地址：
#   https://<服务名>.onrender.com
#
# 免费说明：免费实例空闲 15 分钟会休眠（休眠后首次访问需约 30~60 秒冷启动唤醒），
#           地址永久有效、不会失效；数据库放在 Supabase 不会因休眠丢数据。
#           需要「永不休眠」可选 Starter 方案（约 $7/月），或改用 Railway/Koyeb 常驻实例。

services:
  - type: web
    name: wms-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SERVE_WEB
        value: "true"
      - key: DB_DRIVER
        value: postgres
      # Supabase → Project Settings → Database → Connection string → URI
      - key: DATABASE_URL
        sync: false
      # 平台自动生成随机密钥
      - key: JWT_SECRET
        generateValue: true
      # 前端独立部署时填前端域名；前后端同源可留空
      - key: CORS_ORIGIN
        sync: false
